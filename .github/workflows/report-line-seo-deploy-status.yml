name: Report LINE SEO deploy status

on:
  workflow_run:
    workflows:
      - 'Deploy LINE, pricing and regional works update'
    types:
      - completed

permissions:
  contents: read
  statuses: write

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - name: Publish deployment status on source commit
        uses: actions/github-script@v7
        with:
          script: |
            const run = context.payload.workflow_run;
            const state = run.conclusion === 'success' ? 'success' : 'failure';
            const description = state === 'success'
              ? 'git-test and production verification passed'
              : `deployment workflow ended: ${run.conclusion || 'unknown'}`;
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: run.head_sha,
              state,
              context: 'deploy/line-seo-production',
              description: description.slice(0, 140),
              target_url: run.html_url,
            });
