name: Deploy to XServer git-test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate required secrets
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -eu
          test -n "$FTP_SERVER" || (echo "FTP_SERVER is missing" && exit 1)
          test -n "$FTP_USERNAME" || (echo "FTP_USERNAME is missing" && exit 1)
          test -n "$FTP_PASSWORD" || (echo "FTP_PASSWORD is missing" && exit 1)

      - name: Upload static site to restricted FTP root
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          python3 - <<'PY'
          import ftplib
          import os
          from pathlib import Path

          server = os.environ['FTP_SERVER']
          username = os.environ['FTP_USERNAME']
          password = os.environ['FTP_PASSWORD']

          excluded_dirs = {'.git', '.github', 'docs'}
          excluded_files = {'README.md', '.gitignore', '.user.ini'}

          ftp = ftplib.FTP_TLS(timeout=30)
          ftp.connect(server, 21)
          ftp.login(username, password)
          ftp.prot_p()

          def ensure_dir(name):
              try:
                  ftp.cwd(name)
              except ftplib.error_perm:
                  ftp.mkd(name)
                  ftp.cwd(name)

          def upload_dir(local_dir: Path):
              for item in sorted(local_dir.iterdir()):
                  if item.is_dir():
                      if item.name in excluded_dirs:
                          continue
                      ensure_dir(item.name)
                      upload_dir(item)
                      ftp.cwd('..')
                  elif item.name not in excluded_files:
                      with item.open('rb') as fh:
                          ftp.storbinary(f'STOR {item.name}', fh)
                      print(f'uploaded: {item.as_posix()}')

          try:
              upload_dir(Path('.'))
              print('Deployment completed successfully.')
          finally:
              try:
                  ftp.quit()
              except Exception:
                  ftp.close()
          PY
