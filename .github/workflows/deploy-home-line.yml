name: Deploy homepage LINE and internal works links

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'index.html'

permissions:
  contents: read
  statuses: write

concurrency:
  group: fukuzaki-production-deploy
  cancel-in-progress: false

jobs:
  deploy-home:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4

      - name: Validate homepage source
        run: |
          set -euo pipefail
          test -s index.html
          grep -Fq 'https://line.me/R/ti/p/@761qehyo' index.html
          grep -Fq 'LINEで写真相談' index.html
          grep -Fq 'works/handa-amos-rexx/' index.html
          grep -Fq 'works/anjo-repair/' index.html
          grep -Fq 'works/yokkaichi-repair/' index.html
          grep -Fq 'tel:0566427743' index.html
          python3 - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          import re

          text = Path('index.html').read_text(encoding='utf-8')
          assert '<!doctype html>' in text.lower()
          assert '<html lang="ja">' in text
          assert '<main id="main">' in text
          assert '</html>' in text
          assert not any(x.lower() in text.lower() for x in ('TODO', 'localhost', 'example.com', 'lorem ipsum'))
          title = re.search(r'<title>(.*?)</title>', text, re.S)
          assert title and title.group(1).strip()
          canon = re.search(r'<link rel="canonical" href="([^"]+)">', text)
          assert canon and canon.group(1) == 'https://ayuto.xsrv.jp/'

          class Parser(HTMLParser):
              def __init__(self):
                  super().__init__(convert_charrefs=True)
                  self.links = []
              def handle_starttag(self, tag, attrs):
                  attrs = dict(attrs)
                  if tag == 'a' and attrs.get('href'):
                      self.links.append(attrs['href'])
          p = Parser(); p.feed(text)
          assert p.links
          assert all(not href.startswith('javascript:') for href in p.links)
          print('HOMEPAGE SOURCE VALIDATION OK')
          PY
          sha256sum index.html > /tmp/home-source.sha256

      - name: Configure SSH key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -n "$SSH_PRIVATE_KEY" || { echo 'SSH_PRIVATE_KEY is missing'; exit 1; }
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_xserver
          chmod 600 ~/.ssh/id_xserver
          ssh-keygen -y -f ~/.ssh/id_xserver >/dev/null

      - name: Back up production and git-test homepage
        run: |
          set -euo pipefail
          SSH="ssh -i $HOME/.ssh/id_xserver -p 10022 -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20 -o ServerAliveInterval=10 -o ServerAliveCountMax=2"
          SCP="scp -i $HOME/.ssh/id_xserver -P 10022 -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20"
          REMOTE="ayuto@sv16618.xserver.jp"
          ROOT="/home/ayuto/ayuto.xsrv.jp/public_html"
          TEST="$ROOT/git-test"
          BACKUP="/home/ayuto/deploy-backups/home-line-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo "HOME_BACKUP_DIR=$BACKUP" >> "$GITHUB_ENV"

          connected=0
          for i in 1 2 3 4 5; do
            echo "SSH connection attempt $i"
            if $SSH "$REMOTE" "test -d '$ROOT' && test -d '$TEST' && mkdir -p '$BACKUP'"; then
              connected=1
              break
            fi
            sleep 8
          done
          test "$connected" -eq 1 || { echo 'SSH connection failed after retries'; exit 1; }

          $SSH "$REMOTE" "ROOT='$ROOT' TEST='$TEST' BACKUP='$BACKUP' bash -s" <<'REMOTE_BACKUP'
          set -euo pipefail
          cp -p "$ROOT/index.html" "$BACKUP/production-index.html"
          cp -p "$TEST/index.html" "$BACKUP/git-test-index.html"
          test -s "$BACKUP/production-index.html"
          test -s "$BACKUP/git-test-index.html"
          REMOTE_BACKUP
          $SCP index.html "$REMOTE:$BACKUP/new-index.html"
          $SCP /tmp/home-source.sha256 "$REMOTE:$BACKUP/source.sha256"
          $SSH "$REMOTE" "test -s '$BACKUP/new-index.html' && test -s '$BACKUP/source.sha256'"
          echo "BACKUP READY: $BACKUP"

      - name: Deploy homepage to git-test and verify
        run: |
          set -Eeuo pipefail
          SSH="ssh -i $HOME/.ssh/id_xserver -p 10022 -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20 -o ServerAliveInterval=10 -o ServerAliveCountMax=2"
          REMOTE="ayuto@sv16618.xserver.jp"
          ROOT="/home/ayuto/ayuto.xsrv.jp/public_html"
          TEST="$ROOT/git-test"
          BASE="https://ayuto.xsrv.jp"
          NONCE="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-home-test"

          rollback_test() {
            trap - ERR
            set +e
            echo 'git-test homepage verification failed; restoring previous index'
            $SSH "$REMOTE" "cp -p '$HOME_BACKUP_DIR/git-test-index.html' '$TEST/index.html'"
            exit 1
          }
          trap rollback_test ERR

          $SSH "$REMOTE" "cp -p '$HOME_BACKUP_DIR/new-index.html' '$TEST/index.html' && cd '$TEST' && sha256sum -c '$HOME_BACKUP_DIR/source.sha256'"

          expected="$(sha256sum index.html | awk '{print $1}')"
          for url in "$BASE/git-test/index.html?verify=$NONCE" "$BASE/git-test/?verify=$NONCE"; do
            curl -fsSL --retry 3 --retry-delay 2 -H 'Cache-Control: no-cache' "$url" -o /tmp/home-test-public
            actual="$(sha256sum /tmp/home-test-public | awk '{print $1}')"
            test "$actual" = "$expected" || { echo "git-test public homepage SHA mismatch: $url"; exit 1; }
          done
          grep -Fq 'https://line.me/R/ti/p/@761qehyo' /tmp/home-test-public
          grep -Fq 'LINEで写真相談' /tmp/home-test-public
          grep -Fq 'works/anjo-repair/' /tmp/home-test-public
          grep -Fq 'tel:0566427743' /tmp/home-test-public
          echo 'GIT-TEST HOMEPAGE PUBLIC AND SHA VERIFICATION OK'
          trap - ERR

      - name: Deploy homepage to production and run full after-check
        run: |
          set -Eeuo pipefail
          SSH="ssh -i $HOME/.ssh/id_xserver -p 10022 -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20 -o ServerAliveInterval=10 -o ServerAliveCountMax=2"
          REMOTE="ayuto@sv16618.xserver.jp"
          ROOT="/home/ayuto/ayuto.xsrv.jp/public_html"
          BASE="https://ayuto.xsrv.jp"
          NONCE="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-home-prod"

          rollback_production() {
            trap - ERR
            set +e
            echo 'production homepage verification failed; restoring previous index'
            $SSH "$REMOTE" "cp -p '$HOME_BACKUP_DIR/production-index.html' '$ROOT/index.html'"
            echo 'PRODUCTION HOMEPAGE ROLLBACK COMPLETE'
            exit 1
          }
          trap rollback_production ERR

          $SSH "$REMOTE" "cp -p '$HOME_BACKUP_DIR/new-index.html' '$ROOT/index.html' && cd '$ROOT' && sha256sum -c '$HOME_BACKUP_DIR/source.sha256'"

          expected="$(sha256sum index.html | awk '{print $1}')"
          for url in "$BASE/index.html?verify=$NONCE" "$BASE/?verify=$NONCE"; do
            curl -fsSL --retry 3 --retry-delay 2 -H 'Cache-Control: no-cache' "$url" -o /tmp/home-prod-public
            actual="$(sha256sum /tmp/home-prod-public | awk '{print $1}')"
            test "$actual" = "$expected" || { echo "production public homepage SHA mismatch: $url"; exit 1; }
          done
          grep -Fq 'https://line.me/R/ti/p/@761qehyo' /tmp/home-prod-public
          grep -Fq 'LINEで写真相談' /tmp/home-prod-public
          grep -Fq 'works/handa-amos-rexx/' /tmp/home-prod-public
          grep -Fq 'works/anjo-repair/' /tmp/home-prod-public
          grep -Fq 'works/yokkaichi-repair/' /tmp/home-prod-public
          grep -Fq 'tel:0566427743' /tmp/home-prod-public

          for route in repair contact faq privacy works works/handa-amos-rexx works/anjo-repair works/yokkaichi-repair; do
            code="$(curl -sS -L --retry 3 -o /tmp/home-route -w '%{http_code}' -H 'Cache-Control: no-cache' "$BASE/$route/?verify=$NONCE")"
            test "$code" = 200 || { echo "Production route failed: $route ($code)"; exit 1; }
          done

          curl -fsSL -H 'Cache-Control: no-cache' "$BASE/repair/?verify=$NONCE" -o /tmp/home-repair
          curl -fsSL -H 'Cache-Control: no-cache' "$BASE/contact/?verify=$NONCE" -o /tmp/home-contact
          curl -fsSL -H 'Cache-Control: no-cache' "$BASE/works/?verify=$NONCE" -o /tmp/home-works
          curl -fsSL -H 'Cache-Control: no-cache' "$BASE/sitemap.xml?verify=$NONCE" -o /tmp/home-sitemap
          curl -fsSL -H 'Cache-Control: no-cache' "$BASE/robots.txt?verify=$NONCE" -o /tmp/home-robots
          curl -fsSL -H 'Cache-Control: no-cache' "$BASE/js/main.js?verify=$NONCE" -o /tmp/home-js
          curl -fsSI --retry 3 "$BASE/style.css?verify=$NONCE" >/dev/null
          grep -Fq '料金が変わる主な要素' /tmp/home-repair
          grep -Fq 'https://line.me/R/ti/p/@761qehyo' /tmp/home-contact
          grep -Fq '/works/anjo-repair/' /tmp/home-works
          grep -Fq 'https://ayuto.xsrv.jp/works/anjo-repair/' /tmp/home-sitemap
          grep -Fq 'Sitemap:' /tmp/home-robots
          grep -Fq 'https://line.me/R/ti/p/@761qehyo' /tmp/home-js

          not_found="$BASE/home-after-check-not-found-${GITHUB_RUN_ID}/"
          code="$(curl -sS -o /tmp/home-404 -w '%{http_code}' "$not_found")"
          test "$code" = 404 || { echo "404 status regression: $code"; exit 1; }
          grep -Fq 'ページが見つかりません' /tmp/home-404

          echo 'PRODUCTION HOMEPAGE AND FULL AFTER-CHECK OK'
          trap - ERR

      - name: Publish deployment commit status
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          if [ "$JOB_STATUS" = "success" ]; then STATE=success; DESC='Homepage LINE deployment verified'; else STATE=failure; DESC='Homepage LINE deployment failed or rolled back'; fi
          curl -fsS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d "{\"state\":\"$STATE\",\"context\":\"deploy/home-line-production\",\"description\":\"$DESC\",\"target_url\":\"${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\"}"
