name: Patch exact icon source manifest

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-exact-icon-source.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Replace corrupted first source block with verified chunks
        run: |
          set -eu
          python3 - <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/fix-exact-v42-icons.yml')
          s = p.read_text()
          old = '            deploy/icon-source/brand-part-00 \\\n'
          new = ''.join(f'            deploy/icon-source/brand-part-00x-{i:02d} \\\n' for i in range(8))
          if old not in s:
              raise SystemExit('source line not found')
          p.write_text(s.replace(old, new, 1))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/fix-exact-v42-icons.yml
          git commit -m 'Use verified first chunks for exact v4.2 icon'
          git push origin HEAD:main
