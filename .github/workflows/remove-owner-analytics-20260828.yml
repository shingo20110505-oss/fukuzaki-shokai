name: Remove owner analytics session 20260828

on:
  workflow_dispatch:
  push:
    branches:
      - safe-js-analytics-20260827
    paths:
      - '.github/workflows/remove-owner-analytics-20260828.yml'

permissions:
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -eu
          test -n "$SSH_PRIVATE_KEY"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_xserver
          chmod 600 ~/.ssh/id_xserver
          ssh-keygen -y -f ~/.ssh/id_xserver >/dev/null

      - name: Remove only the confirmed owner session
        run: |
          set -eu
          SSH="ssh -i $HOME/.ssh/id_xserver -p 10022 -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=30"
          REMOTE="ayuto@sv16618.xserver.jp"
          $SSH "$REMOTE" "python3 -" <<'PY'
          from pathlib import Path
          from collections import Counter

          start = "2026-08-28T17:58:58+09:00"
          end = "2026-08-28T17:59:27+09:00"
          root = Path("/home/ayuto/ayuto.xsrv.jp/analytics-data")
          files = sorted(root.glob("events-*.tsv"))
          removed = Counter()
          removed_total = 0
          touched = 0

          for path in files:
              lines = path.read_text(encoding="utf-8").splitlines()
              keep = []
              changed = False
              for line in lines:
                  fields = line.split("\t")
                  if len(fields) == 29 and start <= fields[0] <= end:
                      removed[fields[1]] += 1
                      removed_total += 1
                      changed = True
                  else:
                      keep.append(line)
              if changed:
                  text = "\n".join(keep)
                  if text:
                      text += "\n"
                  path.write_text(text, encoding="utf-8")
                  touched += 1

          print(f"OWNER_SESSION_CLEANUP=OK removed_rows={removed_total} touched_files={touched}")
          for event in sorted(removed):
              print(f"REMOVED_EVENT|{event}|{removed[event]}")

          remaining = 0
          for path in files:
              for line in path.read_text(encoding="utf-8").splitlines():
                  fields = line.split("\t")
                  if len(fields) == 29 and start <= fields[0] <= end:
                      remaining += 1
          print(f"OWNER_SESSION_REMAINING_ROWS={remaining}")
          if remaining != 0:
              raise SystemExit("owner session rows still remain")
          PY
