name: Harden analytics diagnostics once

on:
  push:
    branches:
      - safe-js-analytics-20260827
    paths:
      - '.github/workflows/harden-analytics-diagnostics-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: safe-js-analytics-20260827
          fetch-depth: 0

      - name: Harden report filtering and E2E cleanup
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          report = Path('.github/workflows/xserver-detailed-analytics-report.yml')
          text = report.read_text(encoding='utf-8')
          old = "cat $FILES | awk -F '\\t' 'NF==29 && $20 != \"workflow-production-test\" {print}' > \"$TMP/events\""
          new = "cat $FILES | awk -F '\\t' 'NF==29 && $20 != \"workflow-production-test\" && $20 !~ /^browser-cdp-/ && $20 != \"workflow-browser-e2e\" && $20 != \"speed-diagnostic\" {print}' > \"$TMP/events\""
          if old not in text:
              raise SystemExit('detailed report filter target not found')
          report.write_text(text.replace(old, new, 1), encoding='utf-8')

          e2e = Path('.github/workflows/analytics-browser-e2e.yml')
          text = e2e.read_text(encoding='utf-8')
          old = "      - name: Verify XServer received browser rows and remove only test rows\n        run: |"
          new = "      - name: Verify XServer received browser rows and remove only test rows\n        if: always()\n        run: |"
          if old not in text:
              raise SystemExit('browser E2E cleanup target not found')
          e2e.write_text(text.replace(old, new, 1), encoding='utf-8')

          Path('.github/workflows/harden-analytics-diagnostics-once.yml').unlink()
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/xserver-detailed-analytics-report.yml .github/workflows/analytics-browser-e2e.yml .github/workflows/harden-analytics-diagnostics-once.yml
          git diff --cached --check
          git commit -m 'Harden analytics diagnostic filtering and cleanup'
          git push origin HEAD:safe-js-analytics-20260827
