name: One-shot verify mobile live

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/one-shot-verify-mobile-live.yml'

permissions:
  contents: write

jobs:
  verify-live:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -n "$SSH_PRIVATE_KEY"
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_xserver
          chmod 600 ~/.ssh/id_xserver
          ssh-keygen -y -f ~/.ssh/id_xserver >/dev/null

      - name: Verify production files and public responses
        run: |
          set -euo pipefail
          SSH="ssh -i $HOME/.ssh/id_xserver -p 10022 -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20"
          REMOTE="ayuto@sv16618.xserver.jp"
          ROOT="/home/ayuto/ayuto.xsrv.jp/public_html"

          $SSH "$REMOTE" "ROOT='$ROOT' bash -s" <<'REMOTE'
          set -euo pipefail
          grep -Fq 'style.css?v=20260824e' "$ROOT/index.html"
          grep -Fq 'style.css?v=20260824e' "$ROOT/sales.html"
          grep -Fq 'style.css?v=20260824e' "$ROOT/repair.html"
          grep -Fq 'style.css?v=20260824e' "$ROOT/models.html"
          grep -Fq 'style.css?v=20260824e' "$ROOT/company.html"
          grep -Fq 'style.css?v=20260824e' "$ROOT/contact.html"
          grep -Fq 'deploy-mobile-polish: 2026-08-24' "$ROOT/style.css"
          grep -Fq 'header-line-button' "$ROOT/style.css"
          grep -Fq 'mobile-menu' "$ROOT/style.css"
          test -s "$ROOT/style-base-20260824.css"
          grep -Fq 'header-line-button' "$ROOT/js/main.js"
          echo 'SERVER FILES OK'
          REMOTE

          NONCE="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          curl -fsSL -H 'Cache-Control: no-cache' "https://ayuto.xsrv.jp/?verify=$NONCE" -o /tmp/home
          curl -fsSL -H 'Cache-Control: no-cache' "https://ayuto.xsrv.jp/sales/?verify=$NONCE" -o /tmp/sales
          curl -fsSL -H 'Cache-Control: no-cache' "https://ayuto.xsrv.jp/style.css?verify=$NONCE" -o /tmp/style
          curl -fsSL -H 'Cache-Control: no-cache' "https://ayuto.xsrv.jp/style-base-20260824.css?verify=$NONCE" -o /tmp/base
          curl -fsSL -H 'Cache-Control: no-cache' "https://ayuto.xsrv.jp/js/main.js?verify=$NONCE" -o /tmp/js
          grep -Fq 'style.css?v=20260824e' /tmp/home
          grep -Fq 'style.css?v=20260824e' /tmp/sales
          grep -Fq 'deploy-mobile-polish: 2026-08-24' /tmp/style
          grep -Fq 'Theme Name: フクザキ商会 公式サイト v4.2' /tmp/base
          grep -Fq 'header-line-button' /tmp/js
          echo 'PUBLIC RESPONSES OK'

      - name: Record verified result
        run: |
          set -euo pipefail
          cat > MOBILE_DEPLOY_STATUS.txt <<EOF
          mobile_public_verify=success
          verified_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          css_version=20260824e
          production_files=success
          production_public=success
          header_line_mobile=enabled
          menu_phone_line=enabled
          EOF
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add MOBILE_DEPLOY_STATUS.txt
          git commit -m 'スマホ版の本番反映確認を記録'
          git push origin main
