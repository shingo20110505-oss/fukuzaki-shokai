name: Analytics browser E2E diagnostic

on:
  workflow_dispatch:
  push:
    branches:
      - safe-js-analytics-20260827
    paths:
      - '.github/workflows/analytics-browser-e2e.yml'

permissions:
  contents: read

jobs:
  browser-e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -eu
          test -n "$SSH_PRIVATE_KEY"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_xserver
          chmod 600 ~/.ssh/id_xserver
          ssh-keygen -y -f ~/.ssh/id_xserver >/dev/null

      - name: Open production directly in normal Chrome and inspect page state
        run: |
          set -eu
          command -v google-chrome >/dev/null
          command -v xvfb-run >/dev/null
          python3 -m pip install --quiet websocket-client

          export E2E_MARKER="browser-cdp-${GITHUB_RUN_ID}"
          target_url="https://ayuto.xsrv.jp/?utm_source=${E2E_MARKER}&utm_medium=internal&utm_campaign=browser-cdp"
          rm -rf /tmp/fukuzaki-e2e-profile
          xvfb-run -a google-chrome \
            --no-sandbox \
            --disable-dev-shm-usage \
            --disable-default-apps \
            --disable-extensions \
            --no-first-run \
            --remote-debugging-port=9222 \
            --remote-allow-origins='*' \
            --user-data-dir=/tmp/fukuzaki-e2e-profile \
            "$target_url" >/tmp/fukuzaki-e2e-chrome.log 2>&1 &

          ready=0
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:9222/json/list >/tmp/fukuzaki-e2e-targets.json; then
              ready=1
              break
            fi
            sleep 1
          done
          test "$ready" -eq 1 || (tail -n 100 /tmp/fukuzaki-e2e-chrome.log; exit 1)
          sleep 8

          python3 - <<'PY'
          import json
          import os
          import time
          from urllib.request import urlopen
          import websocket

          marker = os.environ['E2E_MARKER']
          targets = json.load(urlopen('http://127.0.0.1:9222/json/list'))
          safe_targets = [{'type': t.get('type'), 'url': (t.get('url') or '').split('?')[0]} for t in targets]
          print('BROWSER_TARGETS=' + json.dumps(safe_targets, ensure_ascii=False))
          page = next((t for t in targets if t.get('type') == 'page' and 'ayuto.xsrv.jp' in (t.get('url') or '')), None)
          if not page:
              raise SystemExit('LIVE_PAGE_TARGET=MISSING')

          ws = websocket.create_connection(page['webSocketDebuggerUrl'], timeout=2, origin='http://127.0.0.1:9222')
          msg_id = 1
          expression = "JSON.stringify({href:location.origin+location.pathname,title:document.title,ready:document.readyState,webdriver:navigator.webdriver===true,gpc:navigator.globalPrivacyControl===true,dnt:navigator.doNotTrack||null,uaHeadless:/headless/i.test(navigator.userAgent||''),script:!!document.querySelector('script[src*=\\\"analytics.js\\\"]'),seen:localStorage.getItem('fz_seen_v1'),day:localStorage.getItem('fz_day_v1'),last:!!localStorage.getItem('fz_last_v1'),resources:performance.getEntriesByType('resource').filter(e=>e.name.includes('analytics')).map(e=>({path:new URL(e.name).pathname,type:e.initiatorType,status:Number(e.responseStatus||0)}))})"
          ws.send(json.dumps({'id': msg_id, 'method': 'Runtime.evaluate', 'params': {'expression': expression, 'returnByValue': True}}))

          diag = None
          deadline = time.time() + 5
          while time.time() < deadline:
              try:
                  msg = json.loads(ws.recv())
              except websocket.WebSocketTimeoutException:
                  continue
              if msg.get('id') == msg_id:
                  if 'error' in msg:
                      print('BROWSER_EVAL_ERROR=' + json.dumps(msg['error'], ensure_ascii=False))
                      break
                  result = msg.get('result', {})
                  inner = result.get('result', {})
                  if inner.get('value'):
                      diag = json.loads(inner['value'])
                  elif inner.get('description'):
                      print('BROWSER_EVAL_DESCRIPTION=' + str(inner.get('description')))
                  break

          try:
              ws.send(json.dumps({'id': 2, 'method': 'Browser.close', 'params': {}}))
          except Exception:
              pass
          ws.close()

          print('BROWSER_PAGE_DIAG=' + json.dumps(diag, ensure_ascii=False, sort_keys=True))
          if not diag:
              raise SystemExit('BROWSER_PAGE_DIAG=MISSING')
          if diag.get('href') != 'https://ayuto.xsrv.jp/':
              raise SystemExit('BROWSER_PAGE_NOT_PRODUCTION')
          if not diag.get('script'):
              raise SystemExit('ANALYTICS_SCRIPT_TAG=MISSING')
          if diag.get('webdriver') or diag.get('gpc') or diag.get('dnt') == '1' or diag.get('uaHeadless'):
              raise SystemExit('ANALYTICS_BROWSER_FILTER_ACTIVE')
          if diag.get('seen') != '1':
              raise SystemExit('ANALYTICS_JS_DID_NOT_PASS_FILTERS')
          resources = diag.get('resources') or []
          if not any(r.get('path') == '/analytics.php' for r in resources):
              raise SystemExit('ANALYTICS_FETCH_RESOURCE=MISSING')
          print('BROWSER_PAGE_ANALYTICS_EXECUTION=OK')
          PY

      - name: Verify XServer received browser rows and remove only test rows
        run: |
          set -eu
          SSH="ssh -i $HOME/.ssh/id_xserver -p 10022 -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=30"
          REMOTE="ayuto@sv16618.xserver.jp"
          MARKER="browser-cdp-${GITHUB_RUN_ID}"
          $SSH "$REMOTE" "python3 - '$MARKER'" <<'PY'
          from pathlib import Path
          import sys

          marker = sys.argv[1]
          files = sorted(Path('/home/ayuto/ayuto.xsrv.jp/analytics-data').glob('events-*.tsv'))
          matches = []
          changes = []

          for path in files:
              lines = path.read_text(encoding='utf-8').splitlines()
              keep = []
              changed = False
              for line in lines:
                  fields = line.split('\t')
                  if len(fields) == 29 and fields[19] == marker:
                      matches.append(fields)
                      changed = True
                  else:
                      keep.append(line)
              if changed:
                  changes.append((path, keep))

          if not matches:
              raise SystemExit('XSERVER_BROWSER_RECORD=MISSING')
          if not any(f[1] == 'pageview' for f in matches):
              raise SystemExit('XSERVER_BROWSER_PAGEVIEW=MISSING')

          for path, keep in changes:
              text = '\n'.join(keep)
              if text:
                  text += '\n'
              path.write_text(text, encoding='utf-8')

          events = sorted({f[1] for f in matches})
          first = matches[0]
          print(f"XSERVER_BROWSER_RECORD=OK rows={len(matches)} events={','.join(events)}")
          print(f"XSERVER_BROWSER_CLASS=device:{first[4]} os:{first[5]} browser:{first[6]} timezone:{first[14]}")
          print('XSERVER_BROWSER_TEST_ROWS_REMOVED=OK')
          PY
