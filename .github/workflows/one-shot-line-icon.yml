name: One-shot apply supplied LINE icon

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/one-shot-line-icon.yml'

permissions:
  contents: write

jobs:
  apply-line-icon:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply supplied LINE icon to all homepage LINE CTAs
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p = Path('js/main.js')
          s = p.read_text(encoding='utf-8')
          marker = 'line-icons8-brand-v1'
          if marker in s:
              print('LINE icon already applied')
              raise SystemExit(0)

          icon = 'data:image/png;base64,'

          def replace_once(old, new, label):
              nonlocal_s = None
              global s
              count = s.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 match, got {count}')
              s = s.replace(old, new, 1)

          replace_once('// LINE official-green consultation release: 2026-08-24', '// LINE official-green + supplied icon release: 2026-08-24\n  // line-icons8-brand-v1', 'release marker')
          replace_once("  const lineUrl = 'https://line.me/R/ti/p/@761qehyo';", "  const lineUrl = 'https://line.me/R/ti/p/@761qehyo';\n  const lineIconSrc = '" + icon + "';", 'icon source')

          replace_once("        .floating-line span{font-size:15px;font-weight:850;white-space:nowrap;color:#072d1b}", "        .floating-line .line-brand-icon{width:24px;height:24px;display:block;flex:0 0 auto;border-radius:6px;margin-right:7px}\n        .floating-line span{font-size:15px;font-weight:850;white-space:nowrap;color:#072d1b}", 'floating icon css')
          replace_once("    floatingLine.innerHTML = '<span>LINEで写真相談</span>';", "    floatingLine.innerHTML = `<img class=\"line-brand-icon\" src=\"${lineIconSrc}\" alt=\"\" aria-hidden=\"true\"><span>LINEで写真相談</span>`;", 'floating icon html')

          replace_once("        .home .header-line-button svg{color:#072d1b!important}", "        .home .header-line-button .line-brand-icon{width:20px;height:20px;display:block;flex:0 0 auto;border-radius:5px}", 'header icon css')
          replace_once("        .home .hero-line-cta .hero-phone-cta__icon{background:rgba(255,255,255,.82)!important;color:#057a36!important}", "        .home .hero-line-cta .hero-phone-cta__icon{background:transparent!important;color:#057a36!important;overflow:hidden}\n        .home .hero-line-cta .hero-phone-cta__icon .line-brand-icon{width:100%;height:100%;display:block;object-fit:cover}", 'hero icon css')
          replace_once("        .home .mobile-menu .mobile-line-call{margin-top:12px;background:#06C755!important;color:#072d1b!important;border:1px solid #06C755!important;box-shadow:0 9px 22px rgba(6,199,85,.16)!important}", "        .home .mobile-menu .mobile-line-call{margin-top:12px;background:#06C755!important;color:#072d1b!important;border:1px solid #06C755!important;box-shadow:0 9px 22px rgba(6,199,85,.16)!important}\n        .home .mobile-menu .mobile-line-call .line-brand-icon{width:32px;height:32px;display:block;margin:0 auto 7px;border-radius:8px}", 'mobile icon css')
          replace_once("        .home .contact-line-display{background:#06C755!important;border:1px solid #06C755!important;color:#072d1b!important;box-shadow:0 9px 24px rgba(6,199,85,.16)!important}", "        .home .contact-line-display{background:#06C755!important;border:1px solid #06C755!important;color:#072d1b!important;box-shadow:0 9px 24px rgba(6,199,85,.16)!important}\n        .home .contact-line-display .line-brand-icon{width:34px;height:34px;display:block;margin:0 auto 8px;border-radius:9px}", 'contact icon css')

          old_header = "      headerLineButton.innerHTML = '<svg width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path fill=\"currentColor\" d=\"M4 4h16v12H9l-5 4v-4H4z\"/></svg>LINE相談';"
          new_header = "      headerLineButton.innerHTML = `<img class=\"line-brand-icon\" src=\"${lineIconSrc}\" alt=\"\" aria-hidden=\"true\">LINE相談`;"
          replace_once(old_header, new_header, 'header icon html')

          replace_once("      mobileLineCall.innerHTML = '<small>写真を見せながら相談できます</small><strong>LINEで写真相談</strong><span>機種名・症状・地域・写真を送信</span>';", "      mobileLineCall.innerHTML = `<img class=\"line-brand-icon\" src=\"${lineIconSrc}\" alt=\"\" aria-hidden=\"true\"><small>写真を見せながら相談できます</small><strong>LINEで写真相談</strong><span>機種名・症状・地域・写真を送信</span>`;", 'mobile icon html')

          replace_once("          <span class=\"hero-phone-cta__icon\" aria-hidden=\"true\"><svg viewBox=\"0 0 24 24\"><path fill=\"currentColor\" d=\"M4 4h16v12H9l-5 4v-4H4z\"/></svg></span>", "          <span class=\"hero-phone-cta__icon\" aria-hidden=\"true\"><img class=\"line-brand-icon\" src=\"${lineIconSrc}\" alt=\"\"></span>", 'hero icon html')

          replace_once("      contactLine.innerHTML = '<small>LINE公式アカウント</small><strong>LINEで写真相談</strong><span>機種名・症状・地域・写真を送る</span>';", "      contactLine.innerHTML = `<img class=\"line-brand-icon\" src=\"${lineIconSrc}\" alt=\"\" aria-hidden=\"true\"><small>LINE公式アカウント</small><strong>LINEで写真相談</strong><span>機種名・症状・地域・写真を送る</span>`;", 'contact icon html')

          p.write_text(s, encoding='utf-8')
          PY

          node --check js/main.js
          grep -Fq 'line-icons8-brand-v1' js/main.js
          grep -Fq 'data:image/png;base64,' js/main.js
          grep -Fq 'line-brand-icon' js/main.js

      - name: Commit change to main
        run: |
          set -euo pipefail
          if git diff --quiet -- js/main.js; then
            echo 'No changes required'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/main.js
          git commit -m '提供されたLINEアイコンを相談導線へ適用'
          git push origin main
