name: One-shot mobile LINE icon rebalance

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/one-shot-mobile-line-header-cleanup.yml'

permissions:
  contents: write

jobs:
  rebalance-mobile-line-icons:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Enlarge the two visible smartphone LINE icons
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p = Path('style.css')
          s = p.read_text(encoding='utf-8')
          marker = '/* mobile-line-icon-rebalance: 2026-08-24i */'
          if marker not in s:
              s += r'''

/* mobile-line-icon-rebalance: 2026-08-24i */
@media (max-width:760px){
  /* Header: keep the frameless 44px tap target, but let the LINE mark visually fill it. */
  html body .site-header .header-line-button,
  html body.home .site-header .header-line-button{
    width:44px!important;
    height:44px!important;
    min-height:44px!important;
    flex:0 0 44px!important;
    padding:0!important;
    background:transparent!important;
    border:0!important;
    box-shadow:none!important;
  }
  html body .site-header .header-line-button img,
  html body.home .site-header .header-line-button img{
    width:40px!important;
    height:40px!important;
    max-width:none!important;
    flex:0 0 40px!important;
    display:block!important;
    margin:0!important;
    object-fit:contain!important;
  }

  /* Bottom fixed CTA: icon and text should read as one balanced unit. */
  html body .floating-line{
    display:flex!important;
    align-items:center!important;
    justify-content:center!important;
    gap:10px!important;
  }
  html body .floating-line .line-brand-icon{
    width:36px!important;
    height:36px!important;
    max-width:none!important;
    flex:0 0 36px!important;
    display:block!important;
    margin:0!important;
    object-fit:contain!important;
    transform:none!important;
  }
  html body .floating-line span{
    display:block!important;
    margin:0!important;
    line-height:1.1!important;
  }
}
'''
              p.write_text(s, encoding='utf-8')
          PY

          grep -Fq 'mobile-line-icon-rebalance: 2026-08-24i' style.css
          grep -Fq 'width:40px!important' style.css
          grep -Fq 'width:36px!important' style.css

      - name: Commit CSS change
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git diff --quiet -- style.css; then
            echo 'No change needed'
            exit 0
          fi
          git add style.css
          git commit -m 'スマホLINEアイコン2箇所を自然な大きさへ拡大'
          git push origin main
