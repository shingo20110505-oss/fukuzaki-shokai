name: Deploy to XServer test directory

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate deployment secrets and test path
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_REMOTE_DIR: ${{ secrets.FTP_REMOTE_DIR }}
        run: |
          set -eu
          test -n "$FTP_SERVER" || (echo "FTP_SERVER is missing" && exit 1)
          test -n "$FTP_USERNAME" || (echo "FTP_USERNAME is missing" && exit 1)
          test -n "$FTP_PASSWORD" || (echo "FTP_PASSWORD is missing" && exit 1)
          test -n "$FTP_REMOTE_DIR" || (echo "FTP_REMOTE_DIR is missing" && exit 1)
          case "$FTP_REMOTE_DIR" in
            *git-test*) ;;
            *) echo "Safety stop: FTP_REMOTE_DIR must contain git-test"; exit 1 ;;
          esac

      - name: Install lftp
        run: |
          sudo apt-get update
          sudo apt-get install -y lftp

      - name: Upload static site by FTPS
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_REMOTE_DIR: ${{ secrets.FTP_REMOTE_DIR }}
        run: |
          set -eu
          lftp <<LFTP
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate true
          set net:max-retries 2
          set net:timeout 20
          open "$FTP_SERVER"
          user "$FTP_USERNAME" "$FTP_PASSWORD"
          mirror --reverse --verbose --only-newer \
            --exclude-glob .git/ \
            --exclude-glob .github/ \
            --exclude-glob docs/ \
            --exclude README.md \
            --exclude .gitignore \
            --exclude .user.ini \
            ./ "$FTP_REMOTE_DIR"
          bye
          LFTP
