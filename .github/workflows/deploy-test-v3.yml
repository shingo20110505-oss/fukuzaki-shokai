name: Deploy to XServer git-test retry

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate required secrets
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -eu
          test -n "$FTP_SERVER" || (echo "FTP_SERVER is missing" && exit 1)
          test -n "$FTP_USERNAME" || (echo "FTP_USERNAME is missing" && exit 1)
          test -n "$FTP_PASSWORD" || (echo "FTP_PASSWORD is missing" && exit 1)

      - name: Upload static site into git-test directory with retries
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          python3 - <<'PY'
          import ftplib
          import os
          import time
          from pathlib import Path

          server = os.environ['FTP_SERVER']
          username = os.environ['FTP_USERNAME']
          password = os.environ['FTP_PASSWORD']
          excluded_dirs = {'.git', '.github', 'docs'}
          excluded_files = {'README.md', '.gitignore', '.user.ini'}

          def connect_ftp():
              last_error = None
              for attempt in range(1, 4):
                  ftp = ftplib.FTP_TLS(timeout=60)
                  try:
                      print(f'FTP connection attempt {attempt}/3')
                      ftp.connect(server, 21)
                      ftp.login(username, password)
                      ftp.prot_p()
                      print('FTP connection established.')
                      return ftp
                  except Exception as exc:
                      last_error = exc
                      try:
                          ftp.close()
                      except Exception:
                          pass
                      if attempt < 3:
                          time.sleep(10)
              raise last_error

          ftp = connect_ftp()

          try:
              try:
                  ftp.cwd('git-test')
              except ftplib.error_perm:
                  ftp.mkd('git-test')
                  ftp.cwd('git-test')

              print('Remote target: git-test')

              def ensure_dir(name):
                  try:
                      ftp.cwd(name)
                  except ftplib.error_perm:
                      ftp.mkd(name)
                      ftp.cwd(name)

              def upload_dir(local_dir: Path):
                  for item in sorted(local_dir.iterdir()):
                      if item.is_dir():
                          if item.name in excluded_dirs:
                              continue
                          ensure_dir(item.name)
                          upload_dir(item)
                          ftp.cwd('..')
                      elif item.name not in excluded_files:
                          with item.open('rb') as fh:
                              ftp.storbinary(f'STOR {item.name}', fh)
                          print(f'uploaded: {item.as_posix()}')

              upload_dir(Path('.'))
              print('Deployment to git-test completed successfully.')
          finally:
              try:
                  ftp.quit()
              except Exception:
                  ftp.close()
          PY
