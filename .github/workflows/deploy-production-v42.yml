name: Cut over v4.2 to XServer production

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/deploy-production-v42.yml'

permissions:
  contents: read

jobs:
  deploy-production:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rebuild and verify v4.2 package
        run: |
          set -eu
          cat deploy/v42chunks/part-* > /tmp/v42-site.tar.gz
          echo "df8d06a2ac9128e7ee221383a945598aa431475a44e5a99a50ddb16a9449534d  /tmp/v42-site.tar.gz" | sha256sum -c -
          rm -rf _deploy_v42
          mkdir _deploy_v42
          tar -xzf /tmp/v42-site.tar.gz -C _deploy_v42
          test -f _deploy_v42/index.html
          test -f _deploy_v42/style.css
          test -f _deploy_v42/js/main.js
          grep -q '愛知・三重・岐阜全域' _deploy_v42/index.html
          grep -q 'href="style.css"' _deploy_v42/index.html
          if ! grep -q '^ErrorDocument 404 /404.html$' _deploy_v42/.htaccess; then
            printf '\nErrorDocument 404 /404.html\nRewriteRule ^404/?$ 404.html [L]\n' >> _deploy_v42/.htaccess
          fi
          echo "v4.2 package verified for production"

      - name: Configure SSH private key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -eu
          test -n "$SSH_PRIVATE_KEY" || (echo "SSH_PRIVATE_KEY is missing" && exit 1)
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_xserver
          chmod 600 ~/.ssh/id_xserver
          ssh-keygen -y -f ~/.ssh/id_xserver >/dev/null

      - name: Backup current production, stage, verify, and cut over
        run: |
          set -eu
          SSH_CMD="ssh -i $HOME/.ssh/id_xserver -p 10022 -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20 -o ServerAliveInterval=10 -o ServerAliveCountMax=2"
          REMOTE="ayuto@sv16618.xserver.jp"
          DOMAIN_HOME="/home/ayuto/ayuto.xsrv.jp"
          TARGET="$DOMAIN_HOME/public_html/"
          TESTROOT="${TARGET}git-test/"
          BACKUP_DIR="/home/ayuto/deploy-backups"
          BACKUP="$BACKUP_DIR/pre-static-v42-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.tar.gz"
          STAGE="/home/ayuto/deploy-staging/v42-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}/"

          connected=0
          for i in 1 2 3 4 5; do
            echo "SSH login attempt $i"
            if $SSH_CMD "$REMOTE" "test -d '$TARGET' && mkdir -p '$BACKUP_DIR' '/home/ayuto/deploy-staging'"; then
              connected=1
              break
            fi
            sleep 10
          done
          test "$connected" -eq 1 || (echo "SSH login failed after retries" && exit 1)

          echo "Checking images from the user-verified git-test site..."
          $SSH_CMD "$REMOTE" "test -f '${TESTROOT}images/apple-touch-icon.png' && test -f '${TESTROOT}images/ogp.png' && printf 'git-test images OK\n'"

          echo "Creating production backup before cutover..."
          $SSH_CMD "$REMOTE" "rm -f '$BACKUP' && tar -czf '$BACKUP' -C '$DOMAIN_HOME' public_html && test -s '$BACKUP' && printf 'Production backup OK: $BACKUP\n'"

          echo "Uploading v4.2 to staging directory..."
          $SSH_CMD "$REMOTE" "rm -rf '$STAGE' && mkdir -p '$STAGE'"
          staged=0
          for i in 1 2 3; do
            if rsync -az --delete --exclude 'images/' -e "$SSH_CMD" _deploy_v42/ "$REMOTE:$STAGE"; then
              staged=1
              break
            fi
            sleep 10
          done
          test "$staged" -eq 1 || (echo "Staging upload failed" && exit 1)

          echo "Copying verified git-test images into production staging..."
          $SSH_CMD "$REMOTE" "mkdir -p '${STAGE}images' && cp '${TESTROOT}images/apple-touch-icon.png' '${STAGE}images/apple-touch-icon.png' && cp '${TESTROOT}images/ogp.png' '${STAGE}images/ogp.png'"

          $SSH_CMD "$REMOTE" "test -f '${STAGE}index.html' && test -f '${STAGE}style.css' && test -f '${STAGE}js/main.js' && test -f '${STAGE}images/apple-touch-icon.png' && test -f '${STAGE}images/ogp.png' && grep -q '愛知・三重・岐阜全域' '${STAGE}index.html' && printf 'Staging verification OK\n'"

          echo "Cutting over production..."
          $SSH_CMD "$REMOTE" "rsync -a --delete --exclude 'git-test/' --exclude '.well-known/' --exclude '.user.ini' '$STAGE' '$TARGET'"

          $SSH_CMD "$REMOTE" "test -f '${TARGET}index.html' && test -f '${TARGET}style.css' && test -f '${TARGET}js/main.js' && test -f '${TARGET}images/apple-touch-icon.png' && test -f '${TARGET}images/ogp.png' && test -f '${TARGET}sitemap.xml' && test -f '${TARGET}robots.txt' && grep -q '愛知・三重・岐阜全域' '${TARGET}index.html' && grep -q '^ErrorDocument 404 /404.html$' '${TARGET}.htaccess' && test ! -d '${TARGET}wp-admin' && test -d '${TARGET}git-test' && printf 'PRODUCTION v4.2 VERIFIED\nBackup: $BACKUP\n'"

          $SSH_CMD "$REMOTE" "rm -rf '$STAGE'"
