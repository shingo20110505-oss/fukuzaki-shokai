name: XServer access-log discovery

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/xserver-access-discovery.yml'

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -eu
          test -n "$SSH_PRIVATE_KEY" || (echo "SSH_PRIVATE_KEY is missing" && exit 1)
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_xserver
          chmod 600 ~/.ssh/id_xserver
          ssh-keygen -y -f ~/.ssh/id_xserver >/dev/null
          for i in 1 2 3 4 5; do
            if ssh-keyscan -T 15 -p 10022 sv16618.xserver.jp >> ~/.ssh/known_hosts 2>/dev/null; then
              break
            fi
            if [ "$i" -eq 5 ]; then
              echo "Could not obtain XServer SSH host key"
              exit 1
            fi
            sleep 5
          done
          sort -u ~/.ssh/known_hosts -o ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Discover accessible log and analytics files
        run: |
          set -eu
          SSH_CMD="ssh -i $HOME/.ssh/id_xserver -p 10022 -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=30"
          REMOTE="ayuto@sv16618.xserver.jp"
          $SSH_CMD "$REMOTE" 'bash -s' <<'REMOTE_SCRIPT'
          set -eu
          ROOT="/home/ayuto/ayuto.xsrv.jp"
          LOGDIR="$ROOT/log"
          CONF="$ROOT/awstats/awstats.ayuto.xsrv.jp.conf"
          echo "DISCOVERY_BEGIN"
          echo "ROOT_EXISTS=$([ -d "$ROOT" ] && echo yes || echo no)"
          echo "LOGDIR_EXISTS=$([ -d "$LOGDIR" ] && echo yes || echo no)"
          if [ -d "$LOGDIR" ]; then
            echo "LOGDIR_FILE_COUNT=$(find "$LOGDIR" -maxdepth 1 -type f | wc -l | tr -d ' ')"
            echo "ACCESS_LOG_FILE_COUNT=$(find "$LOGDIR" -maxdepth 1 -type f -name '*access_log*' | wc -l | tr -d ' ')"
          fi

          echo "AWSTATS_CONF_EXISTS=$([ -f "$CONF" ] && echo yes || echo no)"
          if [ -r "$CONF" ]; then
            LOGFILE_SETTING=$(awk -F= '/^[[:space:]]*LogFile[[:space:]]*=/{sub(/^[^=]*=/, ""); gsub(/^[[:space:]]*\"|\"[[:space:]]*$/, ""); print; exit}' "$CONF")
            LOGFORMAT_SETTING=$(awk -F= '/^[[:space:]]*LogFormat[[:space:]]*=/{sub(/^[^=]*=/, ""); gsub(/^[[:space:]]*\"|\"[[:space:]]*$/, ""); print; exit}' "$CONF")
            printf 'AWSTATS_LOGFILE_SETTING=%s\n' "$LOGFILE_SETTING"
            printf 'AWSTATS_LOGFORMAT_SETTING=%s\n' "$LOGFORMAT_SETTING"
          fi

          echo "HOME_LOG_CANDIDATES_BEGIN"
          find /home/ayuto -maxdepth 5 -type f \( -iname '*access_log*' -o -iname 'access.log*' \) -printf '%p|%s bytes\n' 2>/dev/null | head -n 100 || true
          echo "HOME_LOG_CANDIDATES_END"

          echo "CANDIDATES_BEGIN"
          find "$ROOT" -maxdepth 5 -type f \( -iname '*access_log*' -o -iname '*awstats*' -o -iname '*webalizer*' -o -iname '*analytics*' \) -printf '%P|%s bytes\n' 2>/dev/null | head -n 50 || true
          echo "CANDIDATES_END"
          if command -v xserver >/dev/null 2>&1; then
            echo "XSERVER_CLI=available"
            if xserver auth status >/dev/null 2>&1; then
              echo "XSERVER_CLI_AUTH=configured"
            else
              echo "XSERVER_CLI_AUTH=not_configured_or_unsupported"
            fi
          else
            echo "XSERVER_CLI=not_available"
          fi
          echo "DISCOVERY_END"
          REMOTE_SCRIPT
