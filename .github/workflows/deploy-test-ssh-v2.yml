name: Deploy to XServer git-test SSH v2

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/deploy-test-ssh-v2.yml'

permissions:
  contents: read

jobs:
  deploy-test-ssh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate SSH private key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -eu
          test -n "$SSH_PRIVATE_KEY" || (echo "SSH_PRIVATE_KEY is missing" && exit 1)

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -eu
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_xserver
          chmod 600 ~/.ssh/id_xserver
          ssh-keygen -y -f ~/.ssh/id_xserver >/dev/null
          for i in 1 2 3 4 5; do
            if ssh-keyscan -T 15 -p 10022 sv16618.xserver.jp >> ~/.ssh/known_hosts 2>/dev/null; then
              break
            fi
            if [ "$i" -eq 5 ]; then
              echo "Could not obtain XServer SSH host key"
              exit 1
            fi
            sleep 5
          done
          sort -u ~/.ssh/known_hosts -o ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Verify target and deploy with SSH retries
        run: |
          set -eu
          SSH_CMD="ssh -i $HOME/.ssh/id_xserver -p 10022 -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=30"
          REMOTE="ayuto@sv16618.xserver.jp"
          TARGET="/home/ayuto/ayuto.xsrv.jp/public_html/git-test/"

          connected=0
          for i in 1 2 3; do
            if $SSH_CMD "$REMOTE" "mkdir -p '$TARGET' && test -d '$TARGET' && printf 'SSH target OK\n'"; then
              connected=1
              break
            fi
            echo "SSH login attempt $i failed; retrying..."
            sleep 10
          done
          test "$connected" -eq 1 || (echo "SSH login failed after retries" && exit 1)

          rsync -az --delete \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude 'docs/' \
            --exclude 'README.md' \
            --exclude '.gitignore' \
            --exclude '.user.ini' \
            -e "$SSH_CMD" \
            ./ "$REMOTE:$TARGET"

          $SSH_CMD "$REMOTE" "test -f '${TARGET}index.html' && test -f '${TARGET}css/style.css' && test -f '${TARGET}js/main.js' && printf 'Deployment verified\n'"
