name: Deploy v4.2 chunks to XServer git-test

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/deploy-v42-chunks.yml'
      - 'deploy/v42chunks/**'

permissions:
  contents: read

jobs:
  deploy-v42:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate SSH private key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -eu
          test -n "$SSH_PRIVATE_KEY" || (echo "SSH_PRIVATE_KEY is missing" && exit 1)

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -eu
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_xserver
          chmod 600 ~/.ssh/id_xserver
          ssh-keygen -y -f ~/.ssh/id_xserver >/dev/null
          for i in 1 2 3 4 5; do
            if ssh-keyscan -T 15 -p 10022 sv16618.xserver.jp >> ~/.ssh/known_hosts 2>/dev/null; then
              break
            fi
            if [ "$i" -eq 5 ]; then
              echo "Could not obtain XServer SSH host key"
              exit 1
            fi
            sleep 5
          done
          sort -u ~/.ssh/known_hosts -o ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Rebuild and verify v4.2 package
        run: |
          set -eu
          cat deploy/v42chunks/part-* > /tmp/v42-site.tar.gz
          echo "df8d06a2ac9128e7ee221383a945598aa431475a44e5a99a50ddb16a9449534d  /tmp/v42-site.tar.gz" | sha256sum -c -
          rm -rf _deploy_v42
          mkdir _deploy_v42
          tar -xzf /tmp/v42-site.tar.gz -C _deploy_v42
          test -f _deploy_v42/index.html
          test -f _deploy_v42/style.css
          test -f _deploy_v42/js/main.js
          grep -q '愛知・三重・岐阜全域' _deploy_v42/index.html
          grep -q 'href="style.css"' _deploy_v42/index.html

      - name: Deploy v4.2 to git-test
        run: |
          set -eu
          SSH_CMD="ssh -i $HOME/.ssh/id_xserver -p 10022 -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=30"
          REMOTE="ayuto@sv16618.xserver.jp"
          TARGET="/home/ayuto/ayuto.xsrv.jp/public_html/git-test/"

          connected=0
          for i in 1 2 3; do
            if $SSH_CMD "$REMOTE" "mkdir -p '$TARGET' && test -d '$TARGET'"; then
              connected=1
              break
            fi
            echo "SSH login attempt $i failed; retrying..."
            sleep 10
          done
          test "$connected" -eq 1 || (echo "SSH login failed after retries" && exit 1)

          rsync -az --delete \
            --exclude 'images/' \
            -e "$SSH_CMD" \
            _deploy_v42/ "$REMOTE:$TARGET"

          $SSH_CMD "$REMOTE" "test -f '${TARGET}index.html' && test -f '${TARGET}style.css' && test -f '${TARGET}js/main.js' && grep -q '愛知・三重・岐阜全域' '${TARGET}index.html' && printf 'v4.2 deployment verified\n'"
