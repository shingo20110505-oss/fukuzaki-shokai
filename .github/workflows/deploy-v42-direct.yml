name: Deploy v4.2 direct SSH to XServer git-test

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/deploy-v42-direct.yml'

permissions:
  contents: read

jobs:
  deploy-v42:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rebuild and verify v4.2 package
        run: |
          set -eu
          cat deploy/v42chunks/part-* > /tmp/v42-site.tar.gz
          echo "df8d06a2ac9128e7ee221383a945598aa431475a44e5a99a50ddb16a9449534d  /tmp/v42-site.tar.gz" | sha256sum -c -
          rm -rf _deploy_v42
          mkdir _deploy_v42
          tar -xzf /tmp/v42-site.tar.gz -C _deploy_v42
          test -f _deploy_v42/index.html
          test -f _deploy_v42/style.css
          test -f _deploy_v42/js/main.js
          grep -q '愛知・三重・岐阜全域' _deploy_v42/index.html
          grep -q 'href="style.css"' _deploy_v42/index.html
          echo "v4.2 package verified"

      - name: Configure SSH private key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -eu
          test -n "$SSH_PRIVATE_KEY" || (echo "SSH_PRIVATE_KEY is missing" && exit 1)
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_xserver
          chmod 600 ~/.ssh/id_xserver
          ssh-keygen -y -f ~/.ssh/id_xserver >/dev/null

      - name: Deploy v4.2 with direct SSH retries
        run: |
          set -eu
          SSH_CMD="ssh -i $HOME/.ssh/id_xserver -p 10022 -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20 -o ServerAliveInterval=10 -o ServerAliveCountMax=2"
          REMOTE="ayuto@sv16618.xserver.jp"
          TARGET="/home/ayuto/ayuto.xsrv.jp/public_html/git-test/"

          connected=0
          for i in 1 2 3 4 5; do
            echo "SSH login attempt $i"
            if $SSH_CMD "$REMOTE" "mkdir -p '$TARGET' && test -d '$TARGET' && printf 'SSH target OK\n'"; then
              connected=1
              break
            fi
            sleep 10
          done
          test "$connected" -eq 1 || (echo "SSH login failed after retries" && exit 1)

          uploaded=0
          for i in 1 2 3; do
            echo "rsync attempt $i"
            if rsync -az --delete \
              --exclude 'images/' \
              -e "$SSH_CMD" \
              _deploy_v42/ "$REMOTE:$TARGET"; then
              uploaded=1
              break
            fi
            sleep 10
          done
          test "$uploaded" -eq 1 || (echo "rsync failed after retries" && exit 1)

          verified=0
          for i in 1 2 3; do
            if $SSH_CMD "$REMOTE" "test -f '${TARGET}index.html' && test -f '${TARGET}style.css' && test -f '${TARGET}js/main.js' && grep -q '愛知・三重・岐阜全域' '${TARGET}index.html' && printf 'v4.2 deployment verified\n'"; then
              verified=1
              break
            fi
            sleep 10
          done
          test "$verified" -eq 1 || (echo "remote verification failed" && exit 1)
