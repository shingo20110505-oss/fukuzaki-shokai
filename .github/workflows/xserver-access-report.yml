name: XServer AWStats access report

on:
  workflow_dispatch:
  schedule:
    - cron: '45 20 * * *'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/xserver-access-report.yml'

permissions:
  contents: read

jobs:
  access-report:
    runs-on: ubuntu-latest
    steps:
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -eu
          test -n "$SSH_PRIVATE_KEY" || (echo "SSH_PRIVATE_KEY is missing" && exit 1)
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_xserver
          chmod 600 ~/.ssh/id_xserver
          ssh-keygen -y -f ~/.ssh/id_xserver >/dev/null
          for i in 1 2 3 4 5; do
            if ssh-keyscan -T 15 -p 10022 sv16618.xserver.jp >> ~/.ssh/known_hosts 2>/dev/null; then
              break
            fi
            if [ "$i" -eq 5 ]; then
              echo "Could not obtain XServer SSH host key"
              exit 1
            fi
            sleep 5
          done
          sort -u ~/.ssh/known_hosts -o ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Aggregate XServer AWStats and estimate device signatures privately
        run: |
          set -eu
          SSH_CMD="ssh -i $HOME/.ssh/id_xserver -p 10022 -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=30"
          REMOTE="ayuto@sv16618.xserver.jp"

          $SSH_CMD "$REMOTE" 'bash -s' <<'REMOTE_SCRIPT'
          set -eu
          AWDIR="/home/ayuto/ayuto.xsrv.jp/awstats"
          RAWLOG="/home/userlog/nginx/ayuto/ayuto.xsrv.jp.access_log"

          echo "ACCESS_REPORT_BEGIN"
          echo "SOURCE=AWSTATS"
          echo "DOMAIN=ayuto.xsrv.jp"

          if [ ! -d "$AWDIR" ]; then
            echo "ANALYTICS_STATUS=NO_AWSTATS_DIRECTORY"
            echo "ACCESS_REPORT_END"
            exit 0
          fi

          DATA=$(find "$AWDIR" -maxdepth 1 -type f -name 'awstats[0-9]*.ayuto.xsrv.jp.txt' -print | sort | tail -n 1 || true)
          if [ -z "$DATA" ]; then
            echo "ANALYTICS_STATUS=NO_AWSTATS_DATA"
            echo "ACCESS_REPORT_END"
            exit 0
          fi

          general_value() {
            awk -v key="$1" '$1 == key { print $2; exit }' "$DATA"
          }

          LAST_UPDATE=$(general_value LastUpdate || true)
          TOTAL_VISITS=$(general_value TotalVisits || true)
          TOTAL_UNIQUE=$(general_value TotalUnique || true)

          MONTH_PAGEVIEWS=$(awk '
            $1 == "BEGIN_DAY" { inside=1; next }
            $1 == "END_DAY" { inside=0; next }
            inside { total += ($2 + 0) }
            END { print total + 0 }
          ' "$DATA")

          echo "ANALYTICS_STATUS=OK"
          echo "AWSTATS_FILE=$(basename "$DATA")"
          echo "LAST_UPDATE=${LAST_UPDATE:-unknown}"
          echo "HUMAN_PAGEVIEWS_APPROX=$MONTH_PAGEVIEWS"
          echo "EST_VISITS=${TOTAL_VISITS:-0}"
          echo "EST_UNIQUE_VISITORS=${TOTAL_UNIQUE:-0}"

          echo "DAILY_BEGIN"
          awk '
            $1 == "BEGIN_DAY" { inside=1; next }
            $1 == "END_DAY" { inside=0; next }
            inside && $1 ~ /^[0-9]{8}$/ {
              printf "DAILY|%s|pages=%d|hits=%d|visits=%d\n", $1, $2+0, $3+0, $5+0
            }
          ' "$DATA"
          echo "DAILY_END"

          echo "TOP_PAGES_BEGIN"
          awk '
            $1 == "BEGIN_SIDER" { inside=1; next }
            $1 == "END_SIDER" { inside=0; next }
            inside && $1 ~ /^\// { printf "%d\t%s\n", $2+0, $1 }
          ' "$DATA" | sort -nr | head -n 12 | awk -F '\t' '{print "PAGE|" $1 "|" $2}'
          echo "TOP_PAGES_END"

          echo "DEVICES_BEGIN"
          awk '
            $1 == "BEGIN_OS" { inside=1; next }
            $1 == "END_OS" { inside=0; next }
            inside {
              key=tolower($1); n=$2+0;
              if (key ~ /(android|ios|iphone|ipad|ipod|windowsphone|blackberry|mobile)/) mobile += n;
              else if (key ~ /(windows|macosx|macintosh|linux|unix|bsd|chromeos)/) desktop += n;
              else other += n;
            }
            END {
              printf "DEVICE|Mobile|%d\n", mobile+0;
              printf "DEVICE|Desktop|%d\n", desktop+0;
              printf "DEVICE|Other|%d\n", other+0;
            }
          ' "$DATA"
          echo "DEVICES_END"

          echo "DEVICE_SIGNATURES_BEGIN"
          if [ -r "$RAWLOG" ]; then
            echo "DEVICE_SIGNATURE_STATUS=OK"
            awk -F'"' '
              function count_array(a,    k,n) { n=0; for (k in a) n++; return n }
              {
                prefix=$1; request=$2; meta=$3; ua=$6;
                ua_l=tolower(ua);
                isbot=(ua_l ~ /(bot|crawler|spider|slurp|bingpreview|curl|wget|python-requests|github|monitor|uptime|headless|facebookexternalhit)/);
                if (isbot || ua == "" || ua == "-") next;

                split(request, rq, /[[:space:]]+/);
                if (rq[1] != "GET") next;

                gsub(/^[[:space:]]+/, "", meta);
                split(meta, ms, /[[:space:]]+/);
                status=ms[1]+0;
                if (status < 200 || status >= 400) next;

                split(prefix, p, /[[:space:]]+/);
                ip=p[2];
                if (ip == "") next;

                sig=ip SUBSEP ua;
                signatures[sig]=1;
                ips[ip]=1;
                uas[ua]=1;

                if (ua_l ~ /(ipad|tablet|kindle|silk)/) tablet[sig]=1;
                else if (ua_l ~ /(iphone|ipod|android.*mobile|mobile)/) mobile[sig]=1;
                else if (ua_l ~ /(windows|macintosh|x11|linux|cros)/) desktop[sig]=1;
                else other[sig]=1;
              }
              END {
                print "EST_DEVICE_SIGNATURES_IP_UA=" count_array(signatures);
                print "EST_DISTINCT_IPS_RAWLOG=" count_array(ips);
                print "EST_DISTINCT_UA_PROFILES=" count_array(uas);
                print "DEVICE_SIGNATURE|Mobile|" count_array(mobile);
                print "DEVICE_SIGNATURE|Tablet|" count_array(tablet);
                print "DEVICE_SIGNATURE|Desktop|" count_array(desktop);
                print "DEVICE_SIGNATURE|Other|" count_array(other);
              }
            ' "$RAWLOG"
          else
            echo "DEVICE_SIGNATURE_STATUS=RAW_SOURCE_NOT_READABLE"
          fi
          echo "DEVICE_SIGNATURES_END"

          echo "TOP_REFERRERS_BEGIN"
          awk '
            $1 == "BEGIN_REFERER" { inside=1; next }
            $1 == "END_REFERER" { inside=0; next }
            inside {
              url=$1; n=$2+0;
              if (url ~ /^https?:\/\//) {
                sub(/^https?:\/\//, "", url);
                split(url, p, "/");
                host=tolower(p[1]);
                sub(/^www\./, "", host);
                sub(/:[0-9]+$/, "", host);
                if (host != "" && host !~ /(^|\.)ayuto\.xsrv\.jp$/) print n "\t" host;
              }
            }
          ' "$DATA" | awk -F '\t' '{sum[$2]+=$1} END {for (h in sum) print sum[h] "\t" h}' | sort -nr | head -n 12 | awk -F '\t' '{print "REFERRER|" $1 "|" $2}'
          echo "TOP_REFERRERS_END"

          echo "ERRORS_BEGIN"
          awk '
            $1 == "BEGIN_ERRORS" { inside=1; next }
            $1 == "END_ERRORS" { inside=0; next }
            inside && $1 ~ /^[45][0-9][0-9]$/ { printf "ERROR|%s|%d\n", $1, $2+0 }
          ' "$DATA"
          echo "ERRORS_END"

          echo "PRIVACY=Raw IP addresses, HOSTS entries, user-agent strings, and raw request lines are processed only in-memory on XServer and are never printed or copied to GitHub."
          echo "ACCESS_REPORT_END"
          REMOTE_SCRIPT
