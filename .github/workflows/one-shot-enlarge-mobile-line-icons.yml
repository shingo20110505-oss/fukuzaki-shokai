name: One-shot mobile LINE header cleanup and deploy

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/one-shot-enlarge-mobile-line-icons.yml'

permissions:
  contents: write
  statuses: write

jobs:
  cleanup-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Remove mobile header LINE outer frame and center fixed icon
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('style.css')
          s = p.read_text(encoding='utf-8')
          marker = '/* mobile-line-header-cleanup: 2026-08-24h */'
          if marker not in s:
              s += r'''

/* mobile-line-header-cleanup: 2026-08-24h */
@media (max-width:760px){
  html body .site-header .header-line-button,
  html body.home .site-header .header-line-button{
    background:transparent!important;
    border:0!important;
    box-shadow:none!important;
  }
  html body .floating-line{
    display:flex!important;
    align-items:center!important;
    justify-content:center!important;
    gap:8px!important;
  }
  html body .floating-line .line-brand-icon{
    width:27px!important;
    height:27px!important;
    flex:0 0 27px!important;
    display:block!important;
    margin:0!important;
    object-fit:contain!important;
    transform:none!important;
  }
  html body .floating-line span{
    display:block!important;
    line-height:1!important;
  }
}
'''
              p.write_text(s, encoding='utf-8')
          PY
          grep -Fq 'mobile-line-header-cleanup: 2026-08-24h' style.css
          grep -Fq 'background:transparent!important' style.css
          sha256sum style.css > /tmp/style.sha256

      - name: Commit CSS change
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if ! git diff --quiet -- style.css; then
            git add style.css
            git commit -m 'スマホヘッダーLINEの外枠を外してアイコン位置を整える'
            git push origin main
          fi

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -n "$SSH_PRIVATE_KEY"
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_xserver
          chmod 600 ~/.ssh/id_xserver
          ssh-keygen -y -f ~/.ssh/id_xserver >/dev/null

      - name: Backup and deploy to git-test then production
        run: |
          set -euo pipefail
          SSH="ssh -i $HOME/.ssh/id_xserver -p 10022 -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20"
          SCP="scp -i $HOME/.ssh/id_xserver -P 10022 -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20"
          REMOTE="ayuto@sv16618.xserver.jp"
          ROOT="/home/ayuto/ayuto.xsrv.jp/public_html"
          TEST="$ROOT/git-test"
          BACKUP="/home/ayuto/deploy-backups/mobile-line-header-cleanup-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          $SSH "$REMOTE" "mkdir -p '$BACKUP' '$TEST' && cp -p '$ROOT/style.css' '$BACKUP/style.css.before'"
          $SCP style.css /tmp/style.sha256 "$REMOTE:$BACKUP/"
          $SSH "$REMOTE" "TEST='$TEST' ROOT='$ROOT' BACKUP='$BACKUP' bash -s" <<'REMOTE'
          set -euo pipefail
          cp "$BACKUP/style.css" "$TEST/style.css"
          cd "$TEST"
          sha256sum -c "$BACKUP/style.sha256"
          cp "$BACKUP/style.css" "$ROOT/style.css"
          cd "$ROOT"
          sha256sum -c "$BACKUP/style.sha256"
          REMOTE

      - name: Verify public production
        run: |
          set -euo pipefail
          expected="$(sha256sum style.css | awk '{print $1}')"
          curl -fsSL --retry 3 -H 'Cache-Control: no-cache' "https://ayuto.xsrv.jp/style.css?verify=${GITHUB_RUN_ID}" -o /tmp/prod-style.css
          actual="$(sha256sum /tmp/prod-style.css | awk '{print $1}')"
          test "$actual" = "$expected"
          grep -Fq 'mobile-line-header-cleanup: 2026-08-24h' /tmp/prod-style.css
          grep -Fq 'background:transparent!important' /tmp/prod-style.css
          for route in '' sales repair models works company faq contact privacy; do
            if [ -z "$route" ]; then url="https://ayuto.xsrv.jp/"; else url="https://ayuto.xsrv.jp/$route/"; fi
            code="$(curl -sS -L --retry 3 -o /dev/null -w '%{http_code}' -H 'Cache-Control: no-cache' "$url?verify=${GITHUB_RUN_ID}")"
            test "$code" = 200
          done
          echo 'PUBLIC MOBILE LINE HEADER CLEANUP VERIFIED'

      - name: Record success
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          HEAD_SHA="$(git rev-parse HEAD)"
          curl -fsS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${HEAD_SHA}" \
            -d '{"state":"success","context":"deploy/mobile-line-header-cleanup","description":"Mobile LINE header cleanup verified on XServer"}' >/dev/null
