name: One-shot soft LINE surface deploy

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/one-shot-force-mobile-deploy.yml'

permissions:
  contents: write

concurrency:
  group: fukuzaki-line-soft-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  deploy-soft-line:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply soft LINE surfaces and cache bust
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          marker = 'LINE soft-surface release: 2026-08-24f'
          css = Path('style.css')
          s = css.read_text(encoding='utf-8')
          if marker not in s:
              s += r'''

/* LINE soft-surface release: 2026-08-24f
   Keep the official #06C755 as the accent, but reduce the filled green area. */
html body .site-header .header-line-button,
html body.home .site-header .header-line-button{
  background:#F4FFF8!important;
  border-color:#06C755!important;
  color:#163D2B!important;
  box-shadow:0 6px 16px rgba(6,199,85,.10)!important;
}
html body .site-header .header-line-button:hover,
html body.home .site-header .header-line-button:hover{
  background:#E8FFF0!important;
  border-color:#06C755!important;
  color:#163D2B!important;
  box-shadow:0 8px 20px rgba(6,199,85,.13)!important;
}
html body.home .hero-line-cta,
html body.home .contact-line-display,
html body .mobile-menu > .mobile-line-call,
html body.home .mobile-menu > .mobile-line-call,
html body .floating-line{
  background:#F4FFF8!important;
  border-color:#06C755!important;
  color:#163D2B!important;
  box-shadow:0 8px 20px rgba(6,199,85,.10)!important;
}
html body.home .hero-line-cta:hover,
html body.home .contact-line-display:hover,
html body .mobile-menu > .mobile-line-call:hover,
html body.home .mobile-menu > .mobile-line-call:hover,
html body .floating-line:hover{
  background:#E8FFF0!important;
  color:#163D2B!important;
}
html body.home .hero-line-cta small,
html body.home .hero-line-cta strong,
html body.home .hero-line-cta span,
html body.home .contact-line-display small,
html body.home .contact-line-display strong,
html body.home .contact-line-display span,
html body .mobile-menu > .mobile-line-call small,
html body .mobile-menu > .mobile-line-call strong,
html body .mobile-menu > .mobile-line-call span,
html body .floating-line span{
  color:#163D2B!important;
  opacity:1!important;
}
'''
              css.write_text(s, encoding='utf-8')

          html_files = [
              'index.html','sales.html','repair.html','models.html','works.html',
              'company.html','faq.html','contact.html','privacy.html','404.html',
              'works-handa-amos-rexx.html','works-anjo-repair.html','works-yokkaichi-repair.html'
          ]
          for name in html_files:
              p = Path(name)
              text = p.read_text(encoding='utf-8')
              text = text.replace('style.css?v=20260824e', 'style.css?v=20260824f')
              p.write_text(text, encoding='utf-8')
          PY

          grep -Fq 'LINE soft-surface release: 2026-08-24f' style.css
          grep -Fq 'background:#F4FFF8!important' style.css
          grep -Fq 'border-color:#06C755!important' style.css
          for f in index.html sales.html repair.html models.html works.html company.html faq.html contact.html privacy.html 404.html works-handa-amos-rexx.html works-anjo-repair.html works-yokkaichi-repair.html; do
            grep -Fq 'style.css?v=20260824f' "$f"
          done

      - name: Commit source update
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add style.css index.html sales.html repair.html models.html works.html company.html faq.html contact.html privacy.html 404.html works-handa-amos-rexx.html works-anjo-repair.html works-yokkaichi-repair.html
          if ! git diff --cached --quiet; then
            git commit -m 'LINEボタンを淡い背景と公式色アクセントに調整'
            git push origin main
          fi

      - name: Validate deploy source
        run: |
          set -euo pipefail
          grep -Fq 'style.css?v=20260824f' index.html
          grep -Fq 'style.css?v=20260824f' sales.html
          grep -Fq 'LINE soft-surface release: 2026-08-24f' style.css
          grep -Fq '#F4FFF8' style.css
          grep -Fq '#E8FFF0' style.css
          grep -Fq '#06C755' style.css
          test -s style-base-20260824.css
          node --check js/main.js

      - name: Build deploy archive
        run: |
          set -euo pipefail
          cat > /tmp/files.txt <<'FILES'
          index.html
          sales.html
          repair.html
          models.html
          works.html
          company.html
          faq.html
          contact.html
          privacy.html
          404.html
          works-handa-amos-rexx.html
          works-anjo-repair.html
          works-yokkaichi-repair.html
          style.css
          style-base-20260824.css
          js/main.js
          .htaccess
          FILES
          while IFS= read -r f; do test -s "$f" || exit 1; done < /tmp/files.txt
          while IFS= read -r f; do sha256sum "$f"; done < /tmp/files.txt > /tmp/source.sha256
          tar -czf /tmp/site.tar.gz -T /tmp/files.txt

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -n "$SSH_PRIVATE_KEY"
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_xserver
          chmod 600 ~/.ssh/id_xserver
          ssh-keygen -y -f ~/.ssh/id_xserver >/dev/null

      - name: Backup and deploy exact archive
        run: |
          set -euo pipefail
          SSH="ssh -i $HOME/.ssh/id_xserver -p 10022 -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20"
          SCP="scp -i $HOME/.ssh/id_xserver -P 10022 -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20"
          REMOTE="ayuto@sv16618.xserver.jp"
          ROOT="/home/ayuto/ayuto.xsrv.jp/public_html"
          TEST="$ROOT/git-test"
          BACKUP="/home/ayuto/deploy-backups/line-soft-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          $SSH "$REMOTE" "mkdir -p '$BACKUP/production' '$BACKUP/git-test' '$TEST'"
          $SCP /tmp/files.txt /tmp/source.sha256 /tmp/site.tar.gz "$REMOTE:$BACKUP/"
          $SSH "$REMOTE" "ROOT='$ROOT' TEST='$TEST' BACKUP='$BACKUP' bash -s" <<'REMOTE'
          set -euo pipefail
          while IFS= read -r f; do
            if [ -f "$ROOT/$f" ]; then mkdir -p "$BACKUP/production/$(dirname "$f")"; cp -p "$ROOT/$f" "$BACKUP/production/$f"; fi
            if [ -f "$TEST/$f" ]; then mkdir -p "$BACKUP/git-test/$(dirname "$f")"; cp -p "$TEST/$f" "$BACKUP/git-test/$f"; fi
          done < "$BACKUP/files.txt"
          tar -xzf "$BACKUP/site.tar.gz" -C "$TEST"
          cd "$TEST"
          sha256sum -c "$BACKUP/source.sha256"
          grep -Fq 'style.css?v=20260824f' "$TEST/index.html"
          grep -Fq 'LINE soft-surface release: 2026-08-24f' "$TEST/style.css"
          tar -xzf "$BACKUP/site.tar.gz" -C "$ROOT"
          cd "$ROOT"
          sha256sum -c "$BACKUP/source.sha256"
          grep -Fq 'style.css?v=20260824f' "$ROOT/index.html"
          grep -Fq 'LINE soft-surface release: 2026-08-24f' "$ROOT/style.css"
          echo 'XSERVER SOFT LINE FILE VERIFY SUCCESS'
          REMOTE
          echo "BACKUP_DIR=$BACKUP" >> "$GITHUB_ENV"

      - name: Verify public production
        run: |
          set -euo pipefail
          BASE='https://ayuto.xsrv.jp'
          NONCE="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          for route in '' sales repair models works company faq contact privacy works/handa-amos-rexx works/anjo-repair works/yokkaichi-repair; do
            if [ -z "$route" ]; then url="$BASE/?verify=$NONCE"; else url="$BASE/$route/?verify=$NONCE"; fi
            code="$(curl -sS -L --retry 3 -o /tmp/page -w '%{http_code}' -H 'Cache-Control: no-cache' "$url")"
            test "$code" = 200 || { echo "$route=$code"; exit 1; }
          done
          curl -fsSL -H 'Cache-Control: no-cache' "$BASE/?verify=$NONCE" -o /tmp/home
          curl -fsSL -H 'Cache-Control: no-cache' "$BASE/sales/?verify=$NONCE" -o /tmp/sales
          curl -fsSL -H 'Cache-Control: no-cache' "$BASE/style.css?verify=$NONCE" -o /tmp/style
          grep -Fq 'style.css?v=20260824f' /tmp/home
          grep -Fq 'style.css?v=20260824f' /tmp/sales
          grep -Fq 'LINE soft-surface release: 2026-08-24f' /tmp/style
          grep -Fq 'background:#F4FFF8!important' /tmp/style
          grep -Fq 'border-color:#06C755!important' /tmp/style
          echo 'PUBLIC SOFT LINE SUCCESS'

      - name: Commit success record
        run: |
          set -euo pipefail
          git pull --rebase origin main
          cat > MOBILE_DEPLOY_STATUS.txt <<EOF
          mobile_public_verify=success
          css_version=20260824f
          line_soft_surface=success
          line_accent=#06C755
          xserver_sha_verify=success
          public_routes=success
          public_css=success
          public_js=success
          backup=$BACKUP_DIR
          EOF
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add MOBILE_DEPLOY_STATUS.txt
          if ! git diff --cached --quiet; then
            git commit -m 'LINE淡色化のXServer本番検証成功を記録'
            git push origin main
          fi
